<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vault | Movie Night Picker</title>
  <meta name="description"
    content="The Vault — browse the collection, pick your favorites, and let the votes decide tonight's movie.">
  <meta name="theme-color" content="#090a0f">
  <meta property="og:title" content="The Vault | Movie Night Picker">
  <meta property="og:description" content="Pick your favorites. Most votes wins tonight.">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #12151f;
      --card-border: #1f2537;
      --card-hover-border: #3b4566;
      --surface: #171b29;
      --accent-har: #f59e0b;
      --accent-scope: #3b82f6;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --primary: #6366f1;
      --violet: #8b5cf6;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
      --gutter: 1.5rem;
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    html {
      scroll-padding-top: 120px;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    select {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent-har);
      outline-offset: 3px;
    }

    /* ANIMATIONS */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.35s ease-out both;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    @keyframes pop {
      50% {
        transform: scale(1.08);
      }
    }

    @keyframes shake {

      20%,
      60% {
        transform: translateX(-4px);
      }

      40%,
      80% {
        transform: translateX(4px);
      }
    }

    @keyframes flash {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
      }

      30% {
        box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.85);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes land {
      0% {
        transform: scale(0.92);
        box-shadow: 0 0 0 rgba(245, 158, 11, 0);
      }

      60% {
        transform: scale(1.04);
        box-shadow: 0 0 90px rgba(245, 158, 11, 0.55);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes fall {
      to {
        transform: translate3d(var(--x), 110vh, 0) rotate(var(--r));
      }
    }

    /* INTRO GATE */
    .intro-modal {
      position: fixed;
      inset: 0;
      background: rgba(9, 10, 15, 0.97);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      padding: 1.5rem;
    }

    .intro-step {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .intro-step h1 {
      font-size: clamp(2.2rem, 8vw, 2.8rem);
      margin: 0;
    }

    .intro-step p {
      color: var(--text-dim);
      font-size: 1rem;
    }

    .lang-options {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .lang-gate-btn {
      background: var(--surface);
      border: 1px solid #363f5e;
      color: #fff;
      padding: 1rem 2.2rem;
      border-radius: var(--radius);
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 165px;
    }

    .lang-gate-btn.is-last {
      border-color: rgba(245, 158, 11, 0.6);
    }

    .lang-gate-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .video-step {
      width: 100%;
    }

    .intro-frame {
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16/9;
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #000;
    }

    .intro-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .ghost-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      transition: background 0.2s;
    }

    .ghost-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* HEADER */
    header {
      padding: 2.75rem var(--gutter) 1.75rem;
      text-align: center;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 75%);
    }

    h1 {
      font-size: clamp(2rem, 7vw, 2.6rem);
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    h1 span {
      color: var(--accent-har);
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .vault-stats {
      margin-top: 0.9rem;
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex: none;
    }

    .live-dot.on {
      background: var(--success);
      animation: pulse 2s infinite;
    }

    .stats-sep {
      opacity: 0.4;
    }

    .picks-text strong {
      color: var(--success);
    }

    .picks-text.full strong {
      color: var(--accent-har);
    }

    /* STICKY CONTROLS */
    .sticky-top {
      position: sticky;
      top: 0;
      background: rgba(9, 10, 15, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 50;
      padding: 0.9rem var(--gutter);
      border-bottom: 1px solid var(--card-border);
    }

    .controls {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
    }

    .nav-left {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
    }

    .collection-title {
      font-size: 1.15rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .collection-count {
      color: var(--text-dim);
      font-weight: 600;
      font-size: 0.85rem;
      margin-left: 0.4rem;
    }

    .search {
      flex: 0 1 300px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0 0.75rem;
      transition: border-color 0.2s;
    }

    .search:focus-within {
      border-color: var(--card-hover-border);
    }

    .search svg {
      flex: none;
      color: var(--text-dim);
    }

    .search input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
      font: inherit;
      font-size: 0.88rem;
      padding: 0.55rem 0;
    }

    .search input::placeholder {
      color: #64748b;
    }

    .search kbd {
      font-family: inherit;
      font-size: 0.7rem;
      color: #64748b;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 0 0.35rem;
    }

    .search:focus-within kbd {
      display: none;
    }

    .nav-right,
    .admin-tools {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex: none;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-action:hover {
      border-color: var(--card-hover-border);
      color: #fff;
    }

    .btn-action.is-active {
      border-color: rgba(245, 158, 11, 0.6);
      color: #fde68a;
    }

    .btn-decide {
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
    }

    .btn-decide:hover {
      background: var(--violet);
      color: #fff;
      border-color: var(--violet);
    }

    .btn-reset {
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .btn-reset:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .btn-back {
      flex: none;
    }

    .picks-control {
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
      padding-right: 0.5rem;
    }

    .picks-control select {
      background: transparent;
      border: 0;
      font-weight: 800;
      cursor: pointer;
      outline: none;
    }

    .picks-control select option {
      background: var(--surface);
      color: var(--text);
    }

    /* FILTERS */
    .filters {
      max-width: 1200px;
      margin: 1.25rem auto 0;
      padding: 0 var(--gutter);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-dim);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip:hover {
      border-color: var(--card-hover-border);
      color: #fff;
    }

    .chip[aria-pressed="true"] {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.6);
      color: #fde68a;
    }

    .chip-clear {
      border-style: dashed;
    }

    /* LEADERBOARD */
    .leaderboard-section {
      max-width: 1200px;
      margin: 1.5rem auto 0;
      padding: 0 var(--gutter);
    }

    .leaderboard-box {
      background: linear-gradient(135deg, #151826 0%, #0f121d 100%);
      border: 1px solid #232a3d;
      border-radius: var(--radius);
      padding: 1.1rem 1.4rem;
    }

    .leaderboard-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .leaderboard-head h3 {
      font-size: 0.85rem;
      color: var(--accent-har);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .my-picks {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-dim);
    }

    .my-picks strong {
      color: var(--success);
    }

    .leader-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 0.6rem;
      margin-top: 0.85rem;
    }

    .leader-item {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.85rem;
      padding: 0.6rem 0.9rem;
      background: #1b2030;
      border: 0;
      border-left: 3px solid #3b4566;
      border-radius: 8px;
      color: #f1f5f9;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }

    .leader-item:hover {
      background: #222839;
    }

    .leader-item.is-lead {
      border-left-color: var(--accent-har);
    }

    .leader-bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--pct);
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.12), rgba(245, 158, 11, 0.03));
      pointer-events: none;
      transition: width 0.4s var(--ease);
    }

    .leader-rank {
      position: relative;
      font-weight: 800;
      font-size: 0.75rem;
      color: var(--text-dim);
      min-width: 1.1rem;
    }

    .leader-item.is-lead .leader-rank {
      color: var(--accent-har);
    }

    .leader-name {
      position: relative;
      flex: 1;
      font-weight: 700;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .leader-votes {
      position: relative;
      font-weight: 800;
      color: var(--success);
    }

    .leader-more {
      margin-top: 0.75rem;
      background: none;
      border: 0;
      color: var(--text-dim);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .leader-more:hover {
      color: #fff;
    }

    /* SAGA GRID */
    /* HOME ROWS (swipeable shelves of collections) */
    .sagas-grid {
      max-width: 1200px;
      margin: 0.75rem auto 2rem;
    }

    .shelf {
      position: relative;
      margin-top: 1.4rem;
    }

    .shelf-title {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      padding: 0 var(--gutter);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .shelf-count {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dim);
    }

    .shelf-track {
      display: flex;
      gap: 1.1rem;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      scroll-padding-inline: var(--gutter);
      padding: 0.8rem var(--gutter) 1.4rem;
      scrollbar-width: none;
    }

    .shelf-track::-webkit-scrollbar {
      display: none;
    }

    .shelf-track .saga-card {
      flex: 0 0 200px;
      scroll-snap-align: start;
    }

    .shelf-arrow {
      position: absolute;
      top: 2.6rem;
      bottom: 1.4rem;
      z-index: 5;
      width: 3rem;
      border: 0;
      color: #fff;
      font-size: 1.6rem;
      font-weight: 800;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .shelf-arrow.prev {
      left: 0;
      background: linear-gradient(to right, rgba(9, 10, 15, 0.95), rgba(9, 10, 15, 0));
    }

    .shelf-arrow.next {
      right: 0;
      background: linear-gradient(to left, rgba(9, 10, 15, 0.95), rgba(9, 10, 15, 0));
    }

    @media (hover: hover) {
      .shelf:hover .shelf-arrow:not([disabled]),
      .shelf-arrow:focus-visible {
        opacity: 1;
      }
    }

    .shelf-arrow[disabled] {
      pointer-events: none;
    }

    .saga-card {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      padding: 0;
      text-align: center;
      transition: transform 0.3s var(--ease), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .saga-card:hover,
    .saga-card:focus-visible {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--card-hover-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .saga-card.has-picks {
      border-color: rgba(16, 185, 129, 0.55);
    }

    .saga-bg {
      position: absolute;
      inset: 0;
      background-color: #1a1d29;
      background-size: cover;
      background-position: center;
      transition: transform 0.4s ease, filter 0.4s ease;
      filter: brightness(0.6);
    }

    .saga-card:hover .saga-bg,
    .saga-card:focus-visible .saga-bg {
      filter: brightness(0.9);
      transform: scale(1.05);
    }

    .saga-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(9, 10, 15, 1) 0%, rgba(9, 10, 15, 0.4) 40%, rgba(9, 10, 15, 0.1) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .saga-logo-text {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      line-height: 1.2;
    }

    .saga-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--accent-har);
      text-transform: uppercase;
      font-weight: 700;
    }

    .saga-votes {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(9, 10, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      color: #fff;
    }

    /* COLLECTION HUB (a collection made of smaller collections, e.g. MCU phases) */
    .hub {
      max-width: 1200px;
      margin: 1.5rem auto 2rem;
      padding: 0 var(--gutter);
    }

    .hero {
      position: relative;
      display: flex;
      align-items: flex-end;
      min-height: 360px;
      border-radius: 18px;
      overflow: hidden;
      background: #0b0d14;
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 20%;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, rgba(9, 10, 15, 0.97) 0%, rgba(9, 10, 15, 0.7) 38%, rgba(9, 10, 15, 0.1) 80%),
        linear-gradient(to right, rgba(9, 10, 15, 0.85) 0%, rgba(9, 10, 15, 0) 65%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      padding: 2rem 2.2rem;
      max-width: 680px;
    }

    .hero-kicker {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #86efac;
      margin-bottom: 0.5rem;
    }

    .hero-title {
      font-size: clamp(1.9rem, 4.6vw, 3.2rem);
      font-weight: 900;
      line-height: 1.02;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .countdown {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.4rem;
    }

    .cd-unit {
      min-width: 4.4rem;
      padding: 0.65rem 0.5rem 0.55rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .cd-num {
      display: block;
      font-size: 2rem;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .cd-label {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .hero-cta {
      border: 0;
      border-radius: 10px;
      padding: 0.9rem 1.5rem;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      background: #fff;
      color: #000;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    const INTRO_VIDEO_ES = "em8Gy2BRUd4";
    const INTRO_SEEN_KEY = "vault_intro_seen";

    function markIntroSeen() {
      try { sessionStorage.setItem(INTRO_SEEN_KEY, "1"); } catch (e) { }
    }

    function closeIntro() {
      markIntroSeen();
      const modal = document.getElementById("introModal");
      if (modal) modal.remove();
      if (!document.querySelector(".trailer-modal:not([hidden])")) document.body.classList.remove("modal-open");
    }

    function startIntroWithLang(lang) {
      markIntroSeen();
      try { localStorage.setItem("vault_lang", lang); } catch (e) { }
      if (window.setVaultLanguage) window.setVaultLanguage(lang);
      const videoId = lang === "es" ? INTRO_VIDEO_ES : INTRO_VIDEO_EN;

      document.getElementById("langSelectStep").hidden = true;
      document.getElementById("videoStep").hidden = false;
      document.getElementById("skipIntroBtn").textContent = lang === "es" ? "OMITIR INTRO" : "SKIP INTRO";
      document.getElementById("introIframe").src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&iv_load_policy=3`;
      document.getElementById("skipIntroBtn").focus();
    }

    // The intro plays once per visit (browser session); refreshes go straight to the vault.
    (function initIntro() {
      let seen = false;
      try { seen = sessionStorage.getItem(INTRO_SEEN_KEY) === "1"; } catch (e) { }
      if (seen) { closeIntro(); return; }

      let last = null;
      try { last = localStorage.getItem("vault_lang"); } catch (e) { }
      const btn = last && document.querySelector(`.lang-gate-btn[data-lang="${last}"]`);
      if (btn) btn.classList.add("is-last");
    })();

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.getElementById("introModal") && document.getElementById("langSelectStep").hidden) closeIntro();
    });

    // A little TV: HAR fills it, Scope leaves black bars top and bottom.
    function formatIcon(tag, cls = "fmt-icon") {
      const picture = tag === "Scope"
        ? `<rect x="3.2" y="5.6" width="25.6" height="6.8" rx="0.6" fill="currentColor"/>`
        : `<rect x="3.2" y="3.2" width="25.6" height="11.6" rx="0.6" fill="currentColor"/>`;
      return `<svg class="${cls}" viewBox="0 0 32 18" aria-hidden="true" focusable="false"><rect x="1" y="1" width="30" height="16" rx="2.5" fill="rgba(0,0,0,0.6)" stroke="currentColor" stroke-width="1.6"/>${picture}</svg>`;
    }

    const FILTERS = {
      har: { label: "f_har", test: (m) => m.tag === "HAR", excludes: "scope" },
      scope: { label: "f_scope", test: (m) => m.tag === "Scope", excludes: "har" },
      s71: { label: "f_71", test: (m) => m.audio.includes("7.1") },
      dual: { label: "f_dual", test: (m) => (m.audioTags || []).includes("ES") },
      unwatched: { label: "f_unwatched", test: (m) => !watchedMap[m.id] }
    };

    const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "_").replace(/_+/g, "_");
    const normalize = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

    // The audio field also carries picture and edition notes, e.g. "5.1 Surround (IMAX)".
    // Split them so cards show just the sound, and the specs show the rest under Format.
    const PICTURE_NOTES = ["IMAX", "Open Matte", "Native", "1.33:1 Full IMAX"];
    const EDITION_NOTES = ["Extended", "Remastered", "Special Edition"];
    function parseAudio(audio) {
      const match = audio.match(/^(.*?)\s*\(([^)]*)\)$/);
      const notes = match ? match[2].split(",").map(n => n.trim()) : [];
      const other = notes.filter(n => !PICTURE_NOTES.includes(n) && !EDITION_NOTES.includes(n));
      return {
        sound: (match ? match[1] : audio) + (other.length ? ` (${other.join(", ")})` : ""),
        picture: notes.find(n => PICTURE_NOTES.includes(n)) || null,
        edition: notes.find(n => EDITION_NOTES.includes(n)) || null
      };
    }

    const movies = rawMovies.map(m => ({
      ...m,
      ...parseAudio(m.audio),
      id: m.id || slug(`${m.title}_${m.year}`),
      haystack: normalize(`${m.title} ${m.saga} ${m.year}`)
    }));
    const movieById = Object.fromEntries(movies.map(m => [m.id, m]));

    const sagasMap = {};
    movies.forEach(m => {
      (sagasMap[m.saga] ||= []).push(m);
    });

    // Hubs: a collection whose page shows smaller collections (cards) instead of a long

    function formatDate(ms) {

    // ---------- TMDB lookups (posters, trailers, runtime, rating) ----------
    // Small concurrency limiter so browsing a big filter doesn't burst TMDB's rate limit.
    const TMDB_CONCURRENCY = 6;
    let tmdbActive = 0;
    const tmdbQueue = [];
    function tmdbFetch(url) {
      return new Promise((resolve, reject) => {
        const run = () => {
          tmdbActive++;
          fetch(url).then(r => r.json()).then(resolve, reject).finally(() => {
            tmdbActive--;
            if (tmdbQueue.length) tmdbQueue.shift()();
          });
        };
        if (tmdbActive < TMDB_CONCURRENCY) run(); else tmdbQueue.push(run);
      });
    }

    const tmdbLookups = {};
    const cleanQuery = (title) => title.replace(/\s*\([^)]*\)/g, "").replace(/\*/g, "").trim();
    const yearOf = (r) => parseInt((r.release_date || r.first_air_date || "").slice(0, 4), 10);

    async function searchTmdb(type, movie, strictYear) {
      const yearParam = strictYear ? `&${type === "tv" ? "first_air_date_year" : "year"}=${movie.year}` : "";
      const data = await tmdbFetch(`${TMDB_API}/search/${type}?api_key=${TMDB_KEY}&query=${encodeURIComponent(cleanQuery(movie.title))}${yearParam}`);
      const results = data.results || [];
      // Without a strict year filter, only accept a result released within a year of ours.
      return strictYear ? results[0] : results.find(r => Math.abs(yearOf(r) - movie.year) <= 1);
    }

    function resolveTmdb(movie) {
      if (!tmdbLookups[movie.id]) {
        const order = movie.media === "tv" ? ["tv", "movie"] : ["movie", "tv"];
        tmdbLookups[movie.id] = (async () => {
          for (const type of order) {
            for (const strict of [true, false]) {
              try {
                const hit = await searchTmdb(type, movie, strict);
                if (hit) return { type, id: hit.id, poster: hit.poster_path };
              } catch (e) { }
            }
          }
          return null;
        })();
        // Don't cache network failures forever — allow a retry on the next attempt.
        tmdbLookups[movie.id].then(r => { if (!r) delete tmdbLookups[movie.id]; });
      }
      return tmdbLookups[movie.id];
    }

    async function getPoster(movie) {
      if (movie.poster) return movie.poster;
      if (posterCache[movie.id]) return posterCache[movie.id];
      const hit = await resolveTmdb(movie);
      if (!hit || !hit.poster) return null;
      const url = `https://image.tmdb.org/t/p/w500${hit.poster}`;
      posterCache[movie.id] = url;
      store.set(POSTER_CACHE_KEY, JSON.stringify(posterCache));
      return url;
    }

    function loadPoster(movie) {
      getPoster(movie).then(url => {
        if (!url) return;
        document.querySelectorAll(`img[data-poster="${movie.id}"]`).forEach(img => { img.src = url; });
      });
    }

    function scoreVideo(v) {
      let score = 0; const name = (v.name || "").toLowerCase();
      const badWords = ["promo", "teaser", "tv spot", "clip", "featurette", "behind the scenes", "preview", "sneak peek"];
      for (const word of badWords) { if (name.includes(word)) return -5000; }
      if (v.type === "Trailer") score += 500;
      if (v.official === true) score += 250;
      if (name.includes("official trailer")) score += 400;
      if (name.includes("theatrical trailer")) score += 300;
      return score + (v.size || 0);
    }

    function pickTrailer(videos) {
      const youtube = (videos || []).filter(v => v.site === "YouTube");
      if (!youtube.length) return null;
      return youtube.sort((a, b) => scoreVideo(b) - scoreVideo(a))[0].key;
    }

    const detailsInflight = {};
    function freshDetails(movie) {
      const info = detailsCache[movie.id];
      return info && Date.now() - (info.fetchedAt || 0) < DETAILS_TTL_MS ? info : null;
    }

    // One call per title gets runtime, rating and the trailer list (append_to_response=videos).
    function getDetails(movie) {
      const cached = freshDetails(movie);
      if (cached) return Promise.resolve(cached);
      if (!detailsInflight[movie.id]) {
        detailsInflight[movie.id] = (async () => {
          const hit = await resolveTmdb(movie);
          if (!hit) return null;
          const d = await tmdbFetch(`${TMDB_API}/${hit.type}/${hit.id}?api_key=${TMDB_KEY}&append_to_response=videos`);
          const info = {
            runtime: hit.type === "movie" && d.runtime ? d.runtime : null,
            seasons: hit.type === "tv" && d.number_of_seasons ? d.number_of_seasons : null,
            rating: d.vote_count > 0 && d.vote_average ? Math.round(d.vote_average * 10) / 10 : null,
            fetchedAt: Date.now()
          };
          detailsCache[movie.id] = info;
          store.set(DETAILS_CACHE_KEY, JSON.stringify(detailsCache));
          if (!movie.trailer && !trailerCache[movie.id]) {
            const key = pickTrailer(d.videos?.results);
            if (key) {
              trailerCache[movie.id] = key;
              store.set(TRAILER_CACHE_KEY, JSON.stringify(trailerCache));
            }
          }
          return info;
        })().catch(() => null).finally(() => { delete detailsInflight[movie.id]; });
      }
      return detailsInflight[movie.id];
    }

    function formatRuntime(minutes) {
      const h = Math.floor(minutes / 60), m = minutes % 60;
      return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
    }

    function extraHTML(info) {
      if (!info) return "";

      if (info.runtime) parts.push(formatRuntime(info.runtime));
      else if (info.seasons) parts.push(t().seasons(info.seasons));
      if (info.rating) parts.push(`<span class="star">★</span> ${info.rating.toFixed(1)}`);
      return parts.join(" · ");
    }

    function fillDetails(movie, info) {

    async function fetchTrailerKey(movie) {

    // From Dec 1 through Jan 6 (Día de Reyes), the Christmas collection moves to the front.

    // Home page rows. Any collection not listed here lands in the last row, so new

    const HOME_ROWS = [

          const sagas = row.sagas.filter(name => sagasMap[name] && !placed.has(name));
          sagas.forEach(name => placed.add(name));
          return { ...row, sagas };
        });
      const leftover = Object.keys(sagasMap).filter(name => !placed.has(name));
      rows[rows.length - 1].sagas.push(...leftover);
      return rows.filter(row => row.sagas.length);

        </section>`;
    }

    function tickCountdown() {
      const el = document.querySelector("[data-countdown]");
      if (!el) return;
      const ms = Math.max(0, DOOMSDAY_DATE - Date.now());
      const parts = { d: Math.floor(ms / 86400000), h: Math.floor(ms / 3600000) % 24, m: Math.floor(ms / 60000) % 60, s: Math.floor(ms / 1000) % 60 };
      Object.entries(parts).forEach(([u, v]) => {
        const n = el.querySelector(`[data-cd="${u}"]`);
        if (n) n.textContent = String(v).padStart(2, "0");
      });
    }
    setInterval(tickCountdown, 1000);

    function renderHub(saga) {
      const tr = t();
      const hub = hubOf(saga);
      hubEl.innerHTML = `
        ${hub.countdown ? countdownHeroHTML(saga) : ""}
        ${hub.rows.map(row => `
          <h3 class="hub-row-title">${esc(row.title(tr))}</h3>
          <div class="hub-grid">${row.keys.map(key => sectionCardHTML(saga, findSection(saga, key))).join("")}</div>`).join("")}
        <button class="hub-all" data-action="open-section" data-section="all">${tr.see_all((sagasMap[saga] || []).length)}</button>`;
      hubEl.hidden = false;
      tickCountdown();
      hub.sections.forEach(sec => {
        const movie = movieById[sec.coverId];
        if (sec.coverUrl || !movie || movie.poster || posterCache[movie.id]) return;
        getPoster(movie).then(url => {
          const bg = hubEl.querySelector(`[data-section-bg="${sec.key}"]`);
          if (url && bg) bg.style.backgroundImage = `url('${url}')`;
        });
      });
    }

    // ---------- Card specs (the flip side) ----------
    const SPECS_CACHE_KEY = "vault_specs_cache_v1";
    const SPECS_TTL_MS = 30 * 24 * 60 * 60 * 1000;
    const specsCache = store.json(SPECS_CACHE_KEY);
    const specsInflight = {};
    const tmdbLang = () => currentLang === "es" ? "es-MX" : "en-US";
    const uiLocale = () => currentLang === "es" ? "es-GT" : "en-US";

    function cachedSpecs(movie) {
      const spec = specsCache[`${movie.id}|${tmdbLang()}`];
      return spec && Date.now() - (spec.fetchedAt || 0) < SPECS_TTL_MS ? spec : null;
    }

    function getSpecs(movie) {
      const cached = cachedSpecs(movie);
      if (cached) return Promise.resolve(cached);
      const lang = tmdbLang();
      const key = `${movie.id}|${lang}`;
      if (!specsInflight[key]) {
        specsInflight[key] = (async () => {
          const hit = await resolveTmdb(movie);
          if (!hit) return null;
          const tv = hit.type === "tv";
          const base = `${TMDB_API}/${hit.type}/${hit.id}?api_key=${TMDB_KEY}`;
          const d = await tmdbFetch(`${base}&language=${lang}`);
          if (!d || d.success === false) return null;
          const crew = d.credits?.crew || [];
          const spec = {
            tv,
            runtime: d.runtime || null,
            seasons: d.number_of_seasons || null,
            episodes: d.number_of_episodes || null,
            rating: d.vote_count > 0 && d.vote_average ? Math.round(d.vote_average * 10) / 10 : null,
            votes: d.vote_count || 0,
            date: d.release_date || d.first_air_date || null,
            genres: (d.genres || []).map(g => g.name),
            directors: tv ? (d.created_by || []).map(p => p.name) : crew.filter(p => p.job === "Director").map(p => p.name),
            cast: (d.credits?.cast || []).slice(0, 4).map(p => p.name),
            studios: (d.production_companies || []).slice(0, 2).map(p => p.name),
            budget: d.budget || 0,
            revenue: d.revenue || 0,
            tagline: d.tagline || "",
            overview: d.overview || "",
            fetchedAt: Date.now()
          };
          if (!spec.overview && lang !== "en-US") {
            const en = await tmdbFetch(base).catch(() => null);
            spec.overview = en?.overview || "";
            spec.tagline ||= en?.tagline || "";
          }
          specsCache[key] = spec;
          store.set(SPECS_CACHE_KEY, JSON.stringify(specsCache));
          return spec;
        })().catch(() => null).finally(() => { delete specsInflight[key]; });
      }
      return specsInflight[key];
    }

    function formatMoney(n) {
      return new Intl.NumberFormat(uiLocale(), { style: "currency", currency: "USD", notation: "compact", maximumFractionDigits: 1 }).format(n);
    }

    function formatLongDate(iso) {
      return new Date(`${iso}T12:00:00`).toLocaleDateString(uiLocale(), { year: "numeric", month: "long", day: "numeric" });
    }

    function specsBackHTML(m, spec, failed) {
      const tr = t();
      const rows = [];
      const row = (label, value) => { if (value) rows.push(`<dt>${label}</dt><dd>${value}</dd>`); };
      const notes = [m.picture && tr.picture_names[m.picture], m.edition && tr.edition_names[m.edition]].filter(Boolean).join(" · ");
      row(tr.sp_format, `
        <div class="fmt-row ${m.tag === "HAR" ? "is-har" : "is-scope"}">
          ${formatIcon(m.tag, "fmt-big")}
          <div><b>${m.tag}</b> · ${m.tag === "HAR" ? tr.har_short : tr.scope_short}${notes ? `<div class="dim">${esc(notes)}</div>` : ""}</div>
        </div>`);
      row(tr.sp_audio, esc(m.sound));
      row(tr.sp_languages, (m.audioTags || ["EN"]).map(code => tr.lang_names[code] || code).join(", "));
      const runtime = spec?.runtime || (freshDetails(m) || detailsCache[m.id])?.runtime;
      if (spec?.tv) row(tr.sp_seasons, spec.seasons ? `${spec.seasons}${spec.episodes ? ` · ${spec.episodes} ${tr.sp_episodes}` : ""}` : "");
      else row(tr.sp_runtime, runtime ? formatRuntime(runtime) : "");
      row(tr.sp_released, spec?.date ? formatLongDate(spec.date) : "");
      return `
        <div>
          <div class="back-title">${esc(m.title)}</div>
          <div class="back-sub">${m.year}</div>
        </div>
        <dl class="spec-list">${rows.join("")}</dl>
        ${spec ? "" : `<p class="back-status">${failed ? tr.specs_error : tr.specs_loading}</p>`}
        ${spec?.overview ? `<p class="back-overview" title="${esc(tr.read_more)}">${esc(spec.overview)}</p>` : ""}
        <div class="back-actions">
          <button class="back-action" data-action="trailer" data-id="${m.id}">${tr.trailer_hint}</button>
          <button class="back-action back-close" data-action="flip" data-id="${m.id}">${tr.flip_back}</button>
        </div>`;
    }

    function animateFlip(card, swap) {
      if (!card.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) {
        swap();
        return Promise.resolve();
      }
      const out = card.animate(
        [{ transform: "perspective(1000px) rotateY(0deg)" }, { transform: "perspective(1000px) rotateY(90deg)" }],
        { duration: 170, easing: "ease-in", fill: "forwards" });
      return out.finished.then(() => {
        swap();
        const back = card.animate(
          [{ transform: "perspective(1000px) rotateY(-90deg)" }, { transform: "perspective(1000px) rotateY(0deg)" }],
          { duration: 230, easing: "ease-out" });
        out.cancel();
        return back.finished;
      }).catch(() => swap());
    }

    async function flipCard(card) {
      if (!card || card.dataset.flipping) return;
      const movie = movieById[card.dataset.id];
      if (!movie) return;
      const back = card.querySelector(".card-back");
      const toBack = !card.classList.contains("is-flipped");
      card.dataset.flipping = "1";
      if (toBack) back.innerHTML = specsBackHTML(movie, cachedSpecs(movie), false);
      await animateFlip(card, () => {
        card.classList.toggle("is-flipped", toBack);
        back.hidden = !toBack;
      });
      delete card.dataset.flipping;
      if (!toBack) {
        card.querySelector(".specs-btn")?.focus();
        return;
      }
      back.scrollTop = 0;
      back.querySelector(".back-close")?.focus({ preventScroll: true });
      if (cachedSpecs(movie)) return;
      const spec = await getSpecs(movie);
      if (!card.classList.contains("is-flipped")) return;
      const hadFocus = back.contains(document.activeElement);
      back.innerHTML = specsBackHTML(movie, spec, !spec);
      if (hadFocus) back.querySelector(".back-close")?.focus({ preventScroll: true });
    }

    function renderCatalog(list, labelFor, emptyText) {
      if (!list.length) {
        catalogEl.innerHTML = `<p class="empty-state">${emptyText}</p>`;
        return;
      }
      catalogEl.innerHTML = list.map(m => {
        const [label, cls] = labelFor ? labelFor(m) : [];
        return cardHTML(m, label, cls);
      }).join("");
      list.forEach(m => {
        if (!m.poster && !posterCache[m.id]) loadPoster(m);
        if (!freshDetails(m)) getDetails(m).then(info => { if (info) fillDetails(m, info); });
      });
    }

    function isFiltering() {
      return !!searchQuery || activeFilters.size > 0;
    }

    function currentMode() {
      if (currentView === "history") return "history";
      return isFiltering() ? "search" : currentView;
    }

    function historyList() {
      return Object.keys(watchedMap)
        .sort((a, b) => watchedMap[b] - watchedMap[a])
        .map(id => movieById[id]);
    }

    function setTitle(text, count) {
      collectionTitle.innerHTML = `${esc(text)}<span class="collection-count">${count}</span>`;
    }

    function renderView(animate = false) {
      const tr = t();
      const mode = currentMode();
      sagasGrid.hidden = mode !== "sagas";
      catalogContainer.hidden = mode === "sagas";
      // Filters search the whole vault, so they only show on the home page and in results.
      filtersEl.hidden = mode === "history" || mode === "movies";
      hubEl.hidden = true;
      sectionNote.hidden = true;
      catalogEl.hidden = false;
      const inSection = mode === "movies" && !!findSection(activeSaga, activeSection);
      backBtn.querySelector(".btn-label").textContent = inSection ? hubOf(activeSaga).short : tr.btn_back_sagas;
      backBtn.hidden = mode === "sagas";
      historyBtn.classList.toggle("is-active", mode === "history");
      historyBtn.setAttribute("aria-pressed", String(mode === "history"));
      renderFilters();
      renderLegend(mode === "sagas");

      if (mode === "sagas") {
        renderSagas();
        setTitle(tr.collections, Object.keys(sagasMap).length);
        if (animate) replayFade(sagasGrid);
      } else if (mode === "movies") {
        const all = sagasMap[activeSaga] || [];
        const section = findSection(activeSaga, activeSection);
        if (hubOf(activeSaga) && !section) {
          catalogEl.innerHTML = "";
          catalogEl.hidden = true;
          renderHub(activeSaga);
          setTitle(activeSaga, all.length);
        } else {
          const list = section ? sectionList(activeSaga, section) : all;
          const numbered = section?.numbered
            ? (m) => [`#${list.indexOf(m) + 1}${m.saga !== activeSaga ? ` · ${m.saga}` : ""}`, ""]
            : null;
          if (section?.note) {
            sectionNote.innerHTML = section.note(tr);
            sectionNote.hidden = false;
          }
          renderCatalog(list, numbered, "");
          setTitle(section ? section.label(tr) : activeSaga, list.length);
        }
        if (animate) replayFade(catalogContainer);
      } else if (mode === "history") {
        const list = historyList();
        renderCatalog(list, (m) => [tr.watched_on(formatDate(watchedMap[m.id])), "is-watched-label"], tr.history_empty);
        setTitle(tr.history, list.length);
        if (animate) replayFade(catalogContainer);
      } else {
        const q = normalize(searchQuery);
        const results = movies.filter(m => m.haystack.includes(q) && [...activeFilters].every(key => FILTERS[key].test(m)));
        renderCatalog(results, (m) => [m.saga, ""], tr.no_results(esc(searchQuery)));
        setTitle(tr.results, results.length);
        if (animate) replayFade(catalogContainer);
      }
      updateVoteUI();
    }

    function updateVoteUI() {
      const tr = t();
      const tally = computeTally();
      const mine = myBallot();
      const limit = maxPicks();
      const capped = limit > 0 && myPickCount() >= limit;

      catalogEl.querySelectorAll(".card").forEach(card => {
        const id = card.dataset.id;
        const count = tally[id] || 0;
        const picked = mine[id] === true;
        const watchedAt = watchedMap[id];
        card.classList.toggle("is-picked", picked);
        card.classList.toggle("has-votes", count > 0);
        card.classList.toggle("is-watched", !!watchedAt);
        const badge = card.querySelector(".watched-badge");
        badge.hidden = !watchedAt;
        badge.textContent = tr.watched;
        badge.title = watchedAt ? tr.watched_on(formatDate(watchedAt)) : "";
        card.querySelector(".vote-count").textContent = plural(count, tr.pick_singular, tr.pick_plural);
        const btn = card.querySelector(".vote-btn");
        btn.classList.toggle("voted", picked);
        btn.classList.toggle("is-capped", capped);
        btn.setAttribute("aria-pressed", String(picked));
        btn.textContent = picked ? tr.picked_btn : tr.pick_btn;
      });

      document.querySelectorAll(".saga-card").forEach(card => {
        const { saga, section } = card.dataset;
        const sec = section && findSection(saga, section);
        const list = sec ? sectionList(saga, sec) : (sagasMap[saga] || []);
        const total = list.reduce((sum, m) => sum + (tally[m.id] || 0), 0);
        const chip = card.querySelector(".saga-votes");
        chip.hidden = total === 0;
        chip.textContent = `🔥 ${total}`;
        card.classList.toggle("has-picks", list.some(m => mine[m.id] === true));
      });

      renderLeaderboard(tally);
      renderStats(tally);
    }

    function picksSummary() {
      const limit = maxPicks();
      return limit > 0 ? `${myPickCount()}/${limit}` : `${myPickCount()}`;
    }

    function renderLeaderboard(tally) {
      const tr = t();
      const items = movies
        .map(m => ({ movie: m, count: tally[m.id] || 0 }))
        .filter(item => item.count > 0)
        .sort((a, b) => b.count - a.count || a.movie.title.localeCompare(b.movie.title));

      leaderboardSection.hidden = items.length === 0;
      if (!items.length) return;

      const max = items[0].count;
      const visible = leaderboardExpanded ? items : items.slice(0, LEADERBOARD_PREVIEW);
      leaderList.innerHTML = visible.map(item => {
        const rank = 1 + items.filter(other => other.count > item.count).length;
        return `
          <button class="leader-item ${item.count === max ? "is-lead" : ""}" data-action="focus" data-id="${item.movie.id}">
            <span class="leader-bar" style="--pct: ${(item.count / max) * 100}%"></span>
            <span class="leader-rank">${rank}</span>
            <span class="leader-name">${esc(item.movie.title)}</span>
            <span class="leader-votes">${item.count}</span>
          </button>`;
      }).join("");

      const extra = items.length > LEADERBOARD_PREVIEW;
      leaderMoreBtn.hidden = !extra;
      if (extra) leaderMoreBtn.textContent = leaderboardExpanded ? tr.show_less : tr.show_all(items.length);

      $("myPicks").innerHTML = `${tr.your_picks}: <strong>${picksSummary()}</strong>`;
    }

    function renderStats(tally) {
      const tr = t();
      $("liveDot").classList.toggle("on", isConnected);
      $("liveLabel").textContent = isConnected ? tr.live : (hasLoadedSession ? tr.offline : tr.connecting);

      const voters = Object.values(sessionData.ballots || {}).filter(b => b && Object.values(b).some(v => v === true)).length;
      const votes = Object.values(tally).reduce((a, b) => a + b, 0);
      const show = hasLoadedSession;
      $("statsSep").hidden = !show;
      $("statsText").textContent = show
        ? `${plural(voters, tr.voter_singular, tr.voter_plural)} · ${plural(votes, tr.pick_singular, tr.pick_plural)}`
        : "";

      const showPicks = show && !isWinnerPhase();
      const limit = maxPicks();
      const picksEl = $("picksText");
      $("picksSep").hidden = !showPicks;
      picksEl.hidden = !showPicks;
      picksEl.classList.toggle("full", limit > 0 && myPickCount() >= limit);
      picksEl.innerHTML = `${tr.your_picks} <strong>${picksSummary()}</strong>`;
    }

    function setButton(btn, icon, label) {
      btn.querySelector(".btn-icon").textContent = icon;
      btn.querySelector(".btn-label").textContent = label;
      btn.title = label;
      btn.setAttribute("aria-label", label);
    }

    function syncPicksSelect() {
      const value = String(maxPicks());
      if (![...maxPicksSelect.options].some(o => o.value === value)) {
        maxPicksSelect.add(new Option(value, value));
      }
      maxPicksSelect.value = value;
    }

    function applyAdminVisibility() {
      adminTools.hidden = !(adminLink || isAdmin);
      syncPicksSelect();
    }

    function applyStaticTexts() {
      const tr = t();
      const winnerPhase = isWinnerPhase();
      document.documentElement.lang = currentLang;
      langToggleBtn.textContent = tr.lang_toggle;
      langToggleBtn.setAttribute("aria-label", tr.lang_toggle_label);
      $("closeTrailerBtn").textContent = tr.close_trailer;
      $("leaderboardTitle").textContent = tr.lb_nominations;
      $("winnerText").textContent = tr.tonights_movie;
      $("winnerTrailerBtn").textContent = tr.watch_trailer;
      $("vaultSubtitle").textContent = winnerPhase ? tr.subtitle_win : tr.subtitle_nom;
      backBtn.querySelector(".btn-label").textContent = tr.btn_back_sagas;
      searchInput.placeholder = tr.search_placeholder;
      setButton(historyBtn, "🕘", tr.btn_history);
      setButton(adminDecideBtn, winnerPhase ? "↩" : "🎯", winnerPhase ? tr.btn_back_nom : tr.btn_decide);
      setButton(adminResetBtn, "⚡", tr.btn_reset);
      $("picksControlLabel").textContent = tr.picks_setting;
      $("picksControl").title = tr.picks_setting_label;
      maxPicksSelect.setAttribute("aria-label", tr.picks_setting_label);
    }

    function applyLanguage() {
      applyStaticTexts();
      renderView(false);
      if (isWinnerPhase()) renderWinnerScreen();
    }

    window.setVaultLanguage = function (lang) {
      currentLang = lang === "es" ? "es" : "en";
      applyLanguage();
    };

    // ---------- Navigation ----------
    function rememberSagasScroll() {
      if (currentMode() === "sagas") sagasScrollY = window.scrollY;
    }

    function scrollToContent() {
      const top = $("mainHeader").offsetHeight;
      if (window.scrollY > top) window.scrollTo({ top, behavior: "auto" });
    }

    function resetFiltering() {
      searchQuery = "";
      searchInput.value = "";
      activeFilters.clear();
    }

    function openSaga(sagaName, section = null) {
      rememberSagasScroll();
      activeSaga = sagaName;
      activeSection = section;
      currentView = "movies";
      resetFiltering();
      renderView(true);
      scrollToContent();
    }

    function openHistory() {
      rememberSagasScroll();
      currentView = "history";
      resetFiltering();
      renderView(true);
      scrollToContent();
    }

    function openSection(key) {
      activeSection = key;
      resetFiltering();
      renderView(true);
      scrollToContent();
    }

    function goToCollections() {
      currentView = "sagas";
      activeSaga = null;
      activeSection = null;
      resetFiltering();
      renderView(true);
      window.scrollTo({ top: sagasScrollY, behavior: "auto" });
    }

    function focusMovie(movieId) {
      const movie = movieById[movieId];
      if (!movie) return;
      const hub = hubOf(movie.saga);
      const section = hub ? (hub.sections.find(sec => sec.filter?.(movie)) || findSection(movie.saga, "all")) : null;
      openSaga(movie.saga, section?.key || null);
      requestAnimationFrame(() => {
        const card = catalogEl.querySelector(`.card[data-id="${movieId}"]`);
        if (!card) return;
        card.scrollIntoView({ block: "center", behavior: "smooth" });
        card.classList.remove("flash");
        void card.offsetWidth;
        card.classList.add("flash");
      });
    }

    // Typing or filtering always searches the whole vault.
    function leaveHistoryForSearch() {
      if (currentView === "history") currentView = activeSaga ? "movies" : "sagas";
    }

    backBtn.addEventListener("click", () => {
      if (currentMode() === "search") {
        resetFiltering();
        renderView(true);
      } else if (currentView === "movies" && findSection(activeSaga, activeSection)) {
        activeSection = null;
        renderView(true);
        scrollToContent();
      } else {
        goToCollections();
      }
    });

    historyBtn.addEventListener("click", () => {
      if (currentView === "history") goToCollections();
      else openHistory();
    });

    searchInput.addEventListener("input", () => {
      const wasSearching = currentMode() === "search";
      rememberSagasScroll();
      leaveHistoryForSearch();
      searchQuery = searchInput.value.trim();
      renderView(!wasSearching && currentMode() === "search");
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        searchQuery = "";
        searchInput.value = "";
        renderView(true);
        searchInput.blur();
      }
    });

    filtersEl.addEventListener("click", (e) => {
      const chip = e.target.closest("[data-filter]");
      if (!chip) return;
      const key = chip.dataset.filter;
      const wasSearching = currentMode() === "search";
      rememberSagasScroll();
      leaveHistoryForSearch();
      if (key === "clear") {
        activeFilters.clear();
      } else if (activeFilters.has(key)) {
        activeFilters.delete(key);
      } else {
        activeFilters.add(key);
        if (FILTERS[key].excludes) activeFilters.delete(FILTERS[key].excludes);
      }
      renderView(!wasSearching && currentMode() === "search");
      filtersEl.querySelector(`[data-filter="${key}"]`)?.focus();
    });

    leaderMoreBtn.addEventListener("click", () => {
      leaderboardExpanded = !leaderboardExpanded;
      updateVoteUI();
    });

    // ---------- Trailer modal ----------
    let trailerRequest = 0;
    let trailerReturnFocus = null;

    async function openTrailer(movieId) {
      const movie = movieById[movieId];
      if (!movie) return;
      const request = ++trailerRequest;
      trailerReturnFocus = document.activeElement;

      $("trailerTitle").textContent = `${movie.title} (${movie.year})`;
      trailerIframe.src = "about:blank";
      trailerModal.hidden = false;
      document.body.classList.add("modal-open");
      $("closeTrailerBtn").focus();

      const key = await fetchTrailerKey(movie);
      if (request !== trailerRequest || trailerModal.hidden) return;
      if (key) {
        trailerIframe.src = `https://www.youtube-nocookie.com/embed/${key}?autoplay=1&vq=hd1080&rel=0&modestbranding=1`;
      } else {
        closeTrailer();
        showToast(t().trailer_unavailable);
      }
    }

    function closeTrailer() {
      if (trailerModal.hidden) return;
      trailerRequest++;
      trailerModal.hidden = true;
      trailerIframe.src = "about:blank";
      if (!$("introModal")) document.body.classList.remove("modal-open");
      if (trailerReturnFocus && document.contains(trailerReturnFocus)) trailerReturnFocus.focus();
    }

    $("closeTrailerBtn").addEventListener("click", closeTrailer);
    trailerModal.addEventListener("click", (e) => { if (e.target === trailerModal) closeTrailer(); });

    // ---------- Global interactions ----------
    document.addEventListener("click", (e) => {
      const el = e.target.closest("[data-action]");
      if (!el) return;
      const { action, id, saga } = el.dataset;
      if (action === "open-saga") openSaga(saga);
      else if (action === "trailer") openTrailer(id);
      else if (action === "vote") handleVoteClick(id, el);
      else if (action === "focus") focusMovie(id);
      else if (action === "open-section") openSection(el.dataset.section);
      else if (action === "flip") flipCard(el.closest(".card"));
    });

    // Tap the plot summary on a card's back to read all of it.
    document.addEventListener("click", (e) => {
      e.target.closest(".back-overview")?.classList.toggle("is-open");
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !trailerModal.hidden) {
        closeTrailer();
        return;
      }
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
      if (e.key === "/" && !typing && !$("introModal") && trailerModal.hidden && !isWinnerPhase()) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    langToggleBtn.addEventListener("click", () => {
      currentLang = currentLang === "en" ? "es" : "en";
      store.set("vault_lang", currentLang);
      applyLanguage();
    });

    // ---------- Winner screen ----------
    function isWinnerPhase() {
      return sessionData.phase === "winner_declared" && !!sessionData.winner;
    }

    async function renderWinnerScreen() {
      if (spinning) return;
      const { id, votes, wasTie } = sessionData.winner || {};
      const movie = movieById[id];
      if (!movie) return;
      const tr = t();
      $("winnerTitle").textContent = movie.title;
      const baseMeta = `${movie.year} • ${movie.sound} • ${movie.tag}`;
      const metaEl = $("winnerMeta");
      metaEl.textContent = baseMeta;
      $("winnerVotes").textContent = `${tr.won_with} ${plural(votes, tr.pick_singular, tr.pick_plural)}! ${wasTie ? tr.tie_breaker : ""}`.trim();
      $("winnerTrailerBtn").dataset.id = movie.id;

      const img = $("winnerPoster");
      img.alt = movie.title;
      if (img.dataset.movie !== movie.id) {
        img.dataset.movie = movie.id;
        img.src = posterCache[movie.id] || movie.poster || PLACEHOLDER;
        winnerSection.style.removeProperty("--winner-bg");
      }

      getDetails(movie).then(info => {
        const extra = extraHTML(info);
        if (extra && !spinning && img.dataset.movie === movie.id) metaEl.innerHTML = `${esc(baseMeta)} • ${extra}`;
      });

      const url = await getPoster(movie);
      if (url && img.dataset.movie === movie.id && !spinning) {
        img.src = url;
        winnerSection.style.setProperty("--winner-bg", `url("${url}")`);
      }
    }

    function burstConfetti() {
      if (reducedMotion()) return;
      const box = $("confetti");
      const colors = ["#f59e0b", "#6366f1", "#10b981", "#ef4444", "#3b82f6", "#f8fafc", "#8b5cf6"];
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 110; i++) {
        const p = document.createElement("i");
        p.style.left = `${Math.random() * 100}vw`;
        p.style.background = colors[i % colors.length];
        p.style.setProperty("--x", `${Math.random() * 240 - 120}px`);
        p.style.setProperty("--r", `${Math.random() * 1080 - 540}deg`);
        p.style.setProperty("--d", `${2.4 + Math.random() * 2}s`);
        p.style.setProperty("--delay", `${Math.random() * 0.5}s`);
        frag.appendChild(p);
      }
      box.replaceChildren(frag);
      setTimeout(() => box.replaceChildren(), 5200);
    }

    // Shown on every device when a winner was just declared: ties spin through the tied posters first.
    async function playReveal() {
      const token = ++revealToken;
      const w = sessionData.winner;
      const winner = movieById[w?.id];
      if (!winner) return;
      // Firebase may hand arrays back as {0: …, 1: …} objects, so accept either shape.
      const tied = (w.tied && typeof w.tied === "object" ? Object.values(w.tied) : []).map(id => movieById[id]).filter(Boolean);

      if (tied.length > 1 && tied.includes(winner) && !reducedMotion()) {
        spinning = true;
        winnerSection.classList.add("is-spinning");
        winnerSection.classList.remove("landed");
        winnerSection.style.removeProperty("--winner-bg");
        const img = $("winnerPoster");
        img.dataset.movie = "";
        $("winnerVotes").textContent = t().tie_spin;
        $("winnerMeta").textContent = tied.map(m => m.title).join("  ·  ");
        const posters = await Promise.all(tied.map(m => getPoster(m).catch(() => null)));

        const winIdx = tied.indexOf(winner);
        let i = Math.floor(Math.random() * tied.length);
        let delay = 70;
        while (true) {
          if (token !== revealToken || !isWinnerPhase()) {
            spinning = false;
            winnerSection.classList.remove("is-spinning");
            return;
          }
          img.src = posters[i] || PLACEHOLDER;
          img.alt = tied[i].title;
          $("winnerTitle").textContent = tied[i].title;
          await sleep(delay);
          if (delay >= 420 && i === winIdx) break;
          delay = Math.min(delay * 1.12, 480);
          i = (i + 1) % tied.length;
        }
        img.dataset.movie = winner.id;
        spinning = false;
        winnerSection.classList.remove("is-spinning");
      }

      if (token !== revealToken) return;
      await renderWinnerScreen();
      winnerSection.classList.remove("landed");
      void winnerSection.offsetWidth;
      winnerSection.classList.add("landed");
      burstConfetti();
    }

    // ---------- Firebase sync ----------
    function onSessionData() {
      const wasWinner = document.body.classList.contains("is-winner");
      const winnerPhase = isWinnerPhase();
      document.body.classList.toggle("is-winner", winnerPhase);
      applyStaticTexts();

      if (winnerPhase && !wasWinner) {
        closeTrailer();
        window.scrollTo({ top: 0, behavior: "auto" });
        const decidedAt = sessionData.winner.decidedAt;
        const fresh = typeof decidedAt === "number" && Date.now() + serverOffset - decidedAt < REVEAL_WINDOW_MS;
        if (fresh) playReveal();
        else renderWinnerScreen();
      } else if (winnerPhase) {
        renderWinnerScreen();
      } else if (wasWinner) {
        revealToken++;
        spinning = false;
        winnerSection.classList.remove("is-spinning", "landed");
      }
      updateVoteUI();
    }

    onValue(ref(db, ".info/connected"), (snap) => {
      isConnected = snap.val() === true;
      renderStats(computeTally());
    });

    onValue(ref(db, ".info/serverTimeOffset"), (snap) => {
      serverOffset = snap.val() || 0;
    });

    onValue(ref(db, "settings"), (snap) => {
      settings = snap.val() || {};
      syncPicksSelect();
      updateVoteUI();
    }, () => { });

    onValue(ref(db, "history"), (snap) => {
      historyData = snap.val() || {};
      rebuildWatched();
      const mode = currentMode();
      if (mode === "history" || (mode === "search" && activeFilters.has("unwatched"))) renderView(false);
      else updateVoteUI();
    }, () => { });

    const sessionPointerRef = ref(db, "active_session");
    onValue(sessionPointerRef, (snapshot) => {
      const sessionVal = snapshot.val();
      // Once the rules are live only an admin can create this; that's fine, it already exists.
      if (!sessionVal) { set(sessionPointerRef, "round_init").catch(() => { }); return; }
      if (sessionVal === currentSession) return;

      // Detach the old round's listener so a stale round can't overwrite the new one.
      if (unsubscribeSession) unsubscribeSession();
      currentSession = sessionVal;

      unsubscribeSession = onValue(ref(db, `sessions/${currentSession}`), (snap) => {
        const val = snap.val() || {};
        sessionData = { phase: val.phase || "nominations", winner: val.winner || null, ballots: val.ballots || {} };
        hasLoadedSession = true;
        onSessionData();
      });
    });

    // ---------- Identity & admin ----------
    function watchAdmin() {
      if (unsubscribeAdmin) unsubscribeAdmin();
      unsubscribeAdmin = onValue(ref(db, `admins/${userId}`), (snap) => {
        isAdmin = snap.exists();
        applyAdminVisibility();
      }, () => {
        isAdmin = false;
        applyAdminVisibility();
      });
    }

    function settleIdentity(id) {
      userId = id;
      authSettled = true;
      watchAdmin();
      updateVoteUI();
    }

    // Anonymous sign-in gives every visitor an invisible, stable ID the database rules can check.
    // If it isn't enabled in the Firebase console yet, fall back to the old local voter id.
    onAuthStateChanged(auth, (user) => {
      if (user) {
        settleIdentity(user.uid);
      } else {
        signInAnonymously(auth).catch((err) => {
          console.info("[vault] Anonymous sign-in unavailable, using a local voter id:", err?.code || err);
          if (!auth.currentUser) settleIdentity(localVoterId);
          // Admins need to know: publishing database.rules.json now would block all voting.
          if (adminLink) setTimeout(() => showToast(t().auth_missing), 1500);
        });
      }
    });

    async function claimAdmin(pin) {
      if (!pin) return false;
      let rulesLive = false;
      let expected = DEFAULT_ADMIN_PIN;
      try {
        const snap = await get(ref(db, "config/adminPin"));
        if (snap.exists()) expected = String(snap.val());
      } catch (e) {
        rulesLive = true; // config is unreadable once the rules are published
      }

      if (!rulesLive) {
        if (pin !== expected) return false;
        isAdmin = true;
        applyAdminVisibility();
        set(ref(db, `admins/${userId}`), pin).catch(() => { });
        return true;
      }

      // Rules are live: Firebase itself checks the PIN when we try to register as admin.
      if (!auth.currentUser) return false;
      const attempts = /^\d+$/.test(pin) ? [pin, Number(pin)] : [pin];
      for (const value of attempts) {
        try {
          await set(ref(db, `admins/${userId}`), value);
          isAdmin = true;
          applyAdminVisibility();
          return true;
        } catch (e) { }
      }
      return false;
    }

    async function ensureAdmin() {
      if (isAdmin) return true;
      const pin = prompt(t().admin_pin);
      if (pin === null) return false;
      const ok = await claimAdmin(pin.trim());
      if (!ok) showToast(t().wrong_pin);
      return ok;
    }

    function handleVoteClick(movieId, button) {
      if (isWinnerPhase()) return;
      if (!currentSession || !authSettled) { showToast(t().still_connecting); return; }
      const isPicked = myBallot()[movieId] === true;
      const limit = maxPicks();

      if (!isPicked && limit > 0 && myPickCount() >= limit) {
        if (button) {
          button.classList.remove("shake");
          void button.offsetWidth;
          button.classList.add("shake");
        }
        showToast(t().limit_reached(limit));
        return;
      }

      if (button) {
        button.classList.remove("pop");
        void button.offsetWidth;
        button.classList.add("pop");
      }
      set(ref(db, `sessions/${currentSession}/ballots/${userId}/${movieId}`), isPicked ? null : true)
        .catch(() => showToast(t().write_failed));
    }

    adminDecideBtn.addEventListener("click", async () => {
      if (!currentSession) { showToast(t().still_connecting); return; }
      if (!(await ensureAdmin())) return;
      const session = currentSession;

      if (!isWinnerPhase()) {
        const tally = computeTally();
        const nominated = Object.keys(tally).filter(id => movieById[id]);
        if (nominated.length === 0) { showToast(t().no_votes); return; }

        const maxVotes = Math.max(...nominated.map(id => tally[id]));
        const tops = nominated.filter(id => tally[id] === maxVotes);
        const winnerId = tops[Math.floor(Math.random() * tops.length)];

        // One atomic write: winner, phase change and the history log entry land together.
        update(ref(db), {
          [`sessions/${session}/winner`]: { id: winnerId, votes: maxVotes, wasTie: tops.length > 1, tied: tops, decidedAt: serverTimestamp() },
          [`sessions/${session}/phase`]: "winner_declared",
          [`history/${session}`]: { id: winnerId, votes: maxVotes, at: serverTimestamp() }
        }).catch(() => showToast(t().write_failed));
      } else {
        update(ref(db), {
          [`sessions/${session}/phase`]: "nominations",
          [`sessions/${session}/winner`]: null,
          [`history/${session}`]: null
        }).catch(() => showToast(t().write_failed));
      }
    });

    adminResetBtn.addEventListener("click", async () => {
      if (!(await ensureAdmin())) return;
      set(sessionPointerRef, `round_${Date.now()}`)
        .then(() => showToast(t().reset_done))
        .catch(() => showToast(t().write_failed));
    });

    maxPicksSelect.addEventListener("change", async () => {
      const value = Number(maxPicksSelect.value);
      if (!(await ensureAdmin())) { syncPicksSelect(); return; }
      set(ref(db, "settings/maxPicks"), value)
        .then(() => showToast(t().picks_saved(value)))
        .catch(() => { syncPicksSelect(); showToast(t().write_failed); });
    });

    // First paint right away — votes fill in as soon as Firebase answers.
    applyAdminVisibility();
    applyLanguage();
  </script>
</body>

</html>
