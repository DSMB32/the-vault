<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vault | Movie Night Picker</title>
  <meta name="description" content="The Vault — browse the collection, pick your favorites, and let the votes decide tonight's movie.">
  <meta name="theme-color" content="#090a0f">
  <meta property="og:title" content="The Vault | Movie Night Picker">
  <meta property="og:description" content="Pick your favorites. Most votes wins tonight.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #12151f;
      --card-border: #1f2537;
      --card-hover-border: #3b4566;
      --surface: #171b29;
      --accent-har: #f59e0b;
      --accent-scope: #3b82f6;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --primary: #6366f1;
      --violet: #8b5cf6;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 12px;
      --gutter: 1.5rem;
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    html {
      scroll-padding-top: 120px;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }

    body.modal-open {
      overflow: hidden;
    }

    button {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent-har);
      outline-offset: 3px;
    }

    /* PAGE TRANSITION ANIMATION */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.35s ease-out both;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    @keyframes pop {
      50% {
        transform: scale(1.08);
      }
    }

    @keyframes flash {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
      }

      30% {
        box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.85);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* INTRO GATE */
    .intro-modal {
      position: fixed;
      inset: 0;
      background: rgba(9, 10, 15, 0.97);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      padding: 1.5rem;
    }

    .intro-step {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .intro-step h1 {
      font-size: clamp(2.2rem, 8vw, 2.8rem);
      margin: 0;
    }

    .intro-step p {
      color: var(--text-dim);
      font-size: 1rem;
    }

    .lang-options {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .lang-gate-btn {
      background: var(--surface);
      border: 1px solid #363f5e;
      color: #fff;
      padding: 1rem 2.2rem;
      border-radius: var(--radius);
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 165px;
    }

    .lang-gate-btn.is-last {
      border-color: rgba(245, 158, 11, 0.6);
    }

    .lang-gate-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .video-step {
      width: 100%;
    }

    .intro-frame {
      width: 90%;
      max-width: 800px;
      aspect-ratio: 16/9;
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #000;
    }

    .intro-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .ghost-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      transition: background 0.2s;
    }

    .ghost-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* HEADER */
    header {
      padding: 2.75rem var(--gutter) 1.75rem;
      text-align: center;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 75%);
    }

    h1 {
      font-size: clamp(2rem, 7vw, 2.6rem);
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    h1 span {
      color: var(--accent-har);
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
    }

    .vault-stats {
      margin-top: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex: none;
    }

    .live-dot.on {
      background: var(--success);
      animation: pulse 2s infinite;
    }

    .stats-sep {
      opacity: 0.4;
    }

    /* STICKY CONTROLS */
    .sticky-top {
      position: sticky;
      top: 0;
      background: rgba(9, 10, 15, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 50;
      padding: 0.9rem var(--gutter);
      border-bottom: 1px solid var(--card-border);
    }

    .controls {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
    }

    .nav-left {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex: 1 1 auto;
      min-width: 0;
    }

    .collection-title {
      font-size: 1.15rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .collection-count {
      color: var(--text-dim);
      font-weight: 600;
      font-size: 0.85rem;
      margin-left: 0.4rem;
    }

    .search {
      flex: 0 1 300px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0 0.75rem;
      transition: border-color 0.2s;
    }

    .search:focus-within {
      border-color: var(--card-hover-border);
    }

    .search svg {
      flex: none;
      color: var(--text-dim);
    }

    .search input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
      font: inherit;
      font-size: 0.88rem;
      padding: 0.55rem 0;
    }

    .search input::placeholder {
      color: #64748b;
    }

    .search kbd {
      font-family: inherit;
      font-size: 0.7rem;
      color: #64748b;
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 0 0.35rem;
    }

    .search:focus-within kbd {
      display: none;
    }

    .nav-right {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex: none;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-action:hover {
      border-color: var(--card-hover-border);
      color: #fff;
    }

    .btn-decide {
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
    }

    .btn-decide:hover {
      background: var(--violet);
      color: #fff;
      border-color: var(--violet);
    }

    .btn-reset {
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .btn-reset:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .btn-back {
      flex: none;
    }

    /* LEADERBOARD */
    .leaderboard-section {
      max-width: 1200px;
      margin: 1.5rem auto 0;
      padding: 0 var(--gutter);
    }

    .leaderboard-box {
      background: linear-gradient(135deg, #151826 0%, #0f121d 100%);
      border: 1px solid #232a3d;
      border-radius: var(--radius);
      padding: 1.1rem 1.4rem;
    }

    .leaderboard-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .leaderboard-head h3 {
      font-size: 0.85rem;
      color: var(--accent-har);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .my-picks {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-dim);
    }

    .my-picks strong {
      color: var(--success);
    }

    .leader-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 0.6rem;
      margin-top: 0.85rem;
    }

    .leader-item {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.85rem;
      padding: 0.6rem 0.9rem;
      background: #1b2030;
      border: 0;
      border-left: 3px solid #3b4566;
      border-radius: 8px;
      color: #f1f5f9;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }

    .leader-item:hover {
      background: #222839;
    }

    .leader-item.is-lead {
      border-left-color: var(--accent-har);
    }

    .leader-bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--pct);
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.12), rgba(245, 158, 11, 0.03));
      pointer-events: none;
      transition: width 0.4s var(--ease);
    }

    .leader-rank {
      position: relative;
      font-weight: 800;
      font-size: 0.75rem;
      color: var(--text-dim);
      min-width: 1.1rem;
    }

    .leader-item.is-lead .leader-rank {
      color: var(--accent-har);
    }

    .leader-name {
      position: relative;
      flex: 1;
      font-weight: 700;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .leader-votes {
      position: relative;
      font-weight: 800;
      color: var(--success);
    }

    .leader-more {
      margin-top: 0.75rem;
      background: none;
      border: 0;
      color: var(--text-dim);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .leader-more:hover {
      color: #fff;
    }

    /* SAGA GRID */
    .sagas-grid {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 var(--gutter);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .saga-card {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      padding: 0;
      text-align: center;
      transition: transform 0.3s var(--ease), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .saga-card:hover,
    .saga-card:focus-visible {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--card-hover-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .saga-card.has-picks {
      border-color: rgba(16, 185, 129, 0.55);
    }

    .saga-bg {
      position: absolute;
      inset: 0;
      background-color: #1a1d29;
      background-size: cover;
      background-position: center;
      transition: transform 0.4s ease, filter 0.4s ease;
      filter: brightness(0.6);
    }

    .saga-card:hover .saga-bg,
    .saga-card:focus-visible .saga-bg {
      filter: brightness(0.9);
      transform: scale(1.05);
    }

    .saga-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(9, 10, 15, 1) 0%, rgba(9, 10, 15, 0.4) 40%, rgba(9, 10, 15, 0.1) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .saga-logo-text {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      line-height: 1.2;
    }

    .saga-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--accent-har);
      text-transform: uppercase;
      font-weight: 700;
    }

    .saga-votes {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(9, 10, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      color: #fff;
    }

    /* MOVIE CATALOG GRID */
    .catalog {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 var(--gutter);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 1.6rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--card-hover-border);
    }

    .card.is-picked {
      border-color: rgba(16, 185, 129, 0.6);
    }

    .card.flash {
      animation: flash 1.6s ease-out 2;
    }

    .poster-wrap {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #181d2d;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      border: 0;
      padding: 0;
    }

    .poster-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .poster-img {
      transform: scale(1.04);
    }

    .poster-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-size: 0.85rem;
      font-weight: 800;
      color: #475569;
      text-align: center;
      pointer-events: none;
    }

    .poster-img[data-loaded]+.poster-fallback {
      display: none;
    }

    .badge-float {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      letter-spacing: 0.02em;
      z-index: 10;
    }

    .badge-har {
      background: rgba(245, 158, 11, 0.92);
      color: #000;
    }

    .badge-scope {
      background: rgba(59, 130, 246, 0.92);
      color: #fff;
    }

    .trailer-hint {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      z-index: 10;
      transition: background 0.2s;
    }

    .poster-wrap:hover .trailer-hint,
    .poster-wrap:focus-visible .trailer-hint {
      background: var(--danger);
    }

    .card-info {
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .card-saga {
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent-har);
      margin-bottom: 0.25rem;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.3rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
    }

    /* CLEAN STUDIO-STYLE AUDIO TAG */
    .dual-pill {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }

    .card-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 0.65rem;
      border-top: 1px solid #1c2236;
      margin-top: auto;
    }

    .vote-count {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-dim);
    }

    .card.has-votes .vote-count {
      color: var(--success);
    }

    .vote-btn {
      background: #23293e;
      border: 1px solid #363f5e;
      color: #fff;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .vote-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .vote-btn.voted {
      background: var(--success);
      border-color: var(--success);
      color: #000;
    }

    .vote-btn.pop {
      animation: pop 0.25s ease-out;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-dim);
      padding: 3rem 1rem;
      font-weight: 600;
    }

    /* WINNER */
    .winner-section {
      position: relative;
      isolation: isolate;
      max-width: 800px;
      margin: 3rem auto;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 0 var(--gutter);
    }

    .winner-section::before {
      content: "";
      position: absolute;
      inset: 4rem 10% auto;
      height: 70%;
      background: var(--winner-bg, none) center / cover;
      filter: blur(70px) saturate(1.4);
      opacity: 0.35;
      z-index: -1;
      pointer-events: none;
    }

    .winner-kicker {
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
    }

    .winner-poster {
      width: 100%;
      max-width: 350px;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 0 60px rgba(99, 102, 241, 0.3);
      border: 2px solid var(--primary);
      animation: fadeIn 0.6s ease-out both;
    }

    .winner-title {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      line-height: 1.15;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--accent-har);
    }

    .winner-meta {
      font-size: 1.05rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    .winner-votes {
      font-size: 1.05rem;
      color: var(--success);
      font-weight: 800;
      background: rgba(16, 185, 129, 0.15);
      padding: 0.6rem 1.5rem;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.3);

    body.is-winner .winner-section {
      display: flex;
    }

    body.is-winner #sagasGrid,
    body.is-winner #catalogContainer,
    body.is-winner #leaderboardSection,
    body.is-winner .nav-left,
    body.is-winner .search {
      display: none !important;
    }

    body.is-winner .controls {
      justify-content: flex-end;
    }

    /* TRAILER MODAL */
    .trailer-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      z-index: 500;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      gap: 1rem;
    }

    .trailer-title {
      font-size: 1rem;
      font-weight: 800;
      text-align: center;
    }

    .trailer-frame-wrap {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid #2d354d;
      background: #000;
    }

    .trailer-frame-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .trailer-frame-wrap iframe {
      position: relative;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* TOAST */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      background: #1e2333;
      border: 1px solid #363f5e;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 2000;
      max-width: calc(100% - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* RESPONSIVE */
    @media (max-width: 920px) {
      .search {
        order: 3;
        flex: 1 1 100%;
      }

      .search kbd {
        display: none;
      }
    }

    @media (max-width: 560px) {
      :root {
        --gutter: 1rem;
      }

      header {
        padding: 2rem var(--gutter) 1.25rem;
      }

      .sagas-grid,
      .catalog {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.9rem;
        margin: 1.25rem auto;
      }

      .saga-logo-text {
        font-size: 0.95rem;
      }

      .saga-label {
        font-size: 0.55rem;
        letter-spacing: 0.12em;
      }

      .saga-overlay {
        padding: 1rem 0.6rem;
      }

      .card-info {
        padding: 0.7rem;
      }

      .card-title {
        font-size: 0.85rem;
      }

      .card-action {
        flex-wrap: wrap;
      }

      .vote-btn {
        flex: 1 1 100%;
      }

      .nav-right .btn-label,
      .btn-back .btn-label {
        display: none;
      }

      .nav-left {
        flex: 1 1 0;
        gap: 0.5rem;
      }

      .collection-title {
        font-size: 1rem;
      }

      .sticky-top {
        padding: 0.7rem var(--gutter);
      }

      .controls {
        gap: 0.6rem;
      }

      .btn-action {
        padding: 0.5rem 0.7rem;
      }

      .leaderboard-box {
        padding: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

      let last = null;
      try { last = localStorage.getItem("vault_lang"); } catch (e) { }
      const btn = last && document.querySelector(`.lang-gate-btn[data-lang="${last}"]`);
      if (btn) btn.classList.add("is-last");
    })();

    function startIntroWithLang(lang) {
      try { localStorage.setItem("vault_lang", lang); } catch (e) { }
      if (window.setVaultLanguage) window.setVaultLanguage(lang);
      const videoId = lang === "es" ? INTRO_VIDEO_ES : INTRO_VIDEO_EN;

      document.getElementById("langSelectStep").hidden = true;
      document.getElementById("videoStep").hidden = false;
      document.getElementById("skipIntroBtn").textContent = lang === "es" ? "OMITIR INTRO" : "SKIP INTRO";

      document.getElementById("skipIntroBtn").focus();
    }

    function closeIntro() {
      const modal = document.getElementById("introModal");
      if (modal) modal.remove();
      if (!document.querySelector(".trailer-modal:not([hidden])")) document.body.classList.remove("modal-open");

    function computeTally() {
      const tally = {};

        if (!ballot) return;
        Object.keys(ballot).forEach(id => { if (ballot[id] === true) tally[id] = (tally[id] || 0) + 1; });

    // ---------- TMDB lookups (posters + trailers) ----------
    const tmdbLookups = {};
    const cleanQuery = (title) => title.replace(/\s*\([^)]*\)/g, "").replace(/\*/g, "").trim();
    const yearOf = (r) => parseInt((r.release_date || r.first_air_date || "").slice(0, 4), 10);

    async function searchTmdb(type, movie, strictYear) {
      const yearParam = strictYear ? `&${type === "tv" ? "first_air_date_year" : "year"}=${movie.year}` : "";
      const res = await fetch(`${TMDB_API}/search/${type}?api_key=${TMDB_KEY}&query=${encodeURIComponent(cleanQuery(movie.title))}${yearParam}`);
      const data = await res.json();
      const results = data.results || [];
      // Without a strict year filter, only accept a result released within a year of ours.
      return strictYear ? results[0] : results.find(r => Math.abs(yearOf(r) - movie.year) <= 1);
    }

    function resolveTmdb(movie) {
      if (!tmdbLookups[movie.id]) {
        const order = movie.media === "tv" ? ["tv", "movie"] : ["movie", "tv"];
        tmdbLookups[movie.id] = (async () => {
          for (const type of order) {
            for (const strict of [true, false]) {
              try {
                const hit = await searchTmdb(type, movie, strict);
                if (hit) return { type, id: hit.id, poster: hit.poster_path };
              } catch (e) { }
            }
          }
          return null;
        })();
        // Don't cache network failures forever — allow a retry on the next attempt.
        tmdbLookups[movie.id].then(r => { if (!r) delete tmdbLookups[movie.id]; });
      }
      return tmdbLookups[movie.id];
    }

    async function getPoster(movie) {
      if (movie.poster) return movie.poster;
      if (posterCache[movie.id]) return posterCache[movie.id];
      const hit = await resolveTmdb(movie);
      if (!hit || !hit.poster) return null;
      const url = `https://image.tmdb.org/t/p/w500${hit.poster}`;
      posterCache[movie.id] = url;
      store.set(POSTER_CACHE_KEY, JSON.stringify(posterCache));
      return url;
    }

    function loadPoster(movie) {
      getPoster(movie).then(url => {
        if (!url) return;
        document.querySelectorAll(`img[data-poster="${movie.id}"]`).forEach(img => { img.src = url; });
      });
    }

    function scoreVideo(v) {
      let score = 0; const name = (v.name || "").toLowerCase();
      const badWords = ["promo", "teaser", "tv spot", "clip", "featurette", "behind the scenes", "preview", "sneak peek"];
      for (const word of badWords) { if (name.includes(word)) return -5000; }
      if (v.type === "Trailer") score += 500;
      if (v.official === true) score += 250;
      if (name.includes("official trailer")) score += 400;
      if (name.includes("theatrical trailer")) score += 300;
      return score + (v.size || 0);
    }

    async function fetchTrailerKey(movie) {
      if (movie.trailer) return movie.trailer;
      if (trailerCache[movie.id]) return trailerCache[movie.id];
      try {
        const hit = await resolveTmdb(movie);
        if (!hit) return null;
        const res = await fetch(`${TMDB_API}/${hit.type}/${hit.id}/videos?api_key=${TMDB_KEY}`);
        const data = await res.json();
        const youtube = (data.results || []).filter(v => v.site === "YouTube");
        if (!youtube.length) return null;
        const chosen = youtube.sort((a, b) => scoreVideo(b) - scoreVideo(a))[0].key;
        trailerCache[movie.id] = chosen;
        store.set(TRAILER_CACHE_KEY, JSON.stringify(trailerCache));
        return chosen;
      } catch (e) {
        return null;
      }
    }

    function renderLeaderboard(tally, mine) {
      const tr = t();
      const items = movies
        .map(m => ({ movie: m, count: tally[m.id] || 0 }))
        .filter(item => item.count > 0)
        .sort((a, b) => b.count - a.count || a.movie.title.localeCompare(b.movie.title));

      leaderboardSection.hidden = items.length === 0;

      const max = items[0].count;
      const visible = leaderboardExpanded ? items : items.slice(0, LEADERBOARD_PREVIEW);
      leaderList.innerHTML = visible.map(item => {
        const rank = 1 + items.filter(other => other.count > item.count).length;
        return `
          <button class="leader-item ${item.count === max ? "is-lead" : ""}" data-action="focus" data-id="${item.movie.id}">
            <span class="leader-bar" style="--pct: ${(item.count / max) * 100}%"></span>
            <span class="leader-rank">${rank}</span>
            <span class="leader-name">${esc(item.movie.title)}</span>
            <span class="leader-votes">${item.count}</span>
          </button>`;
      }).join("");

      const extra = items.length > LEADERBOARD_PREVIEW;
      leaderMoreBtn.hidden = !extra;
      if (extra) leaderMoreBtn.textContent = leaderboardExpanded ? tr.show_less : tr.show_all(items.length);

      const myCount = Object.values(mine).filter(v => v === true).length;
      $("myPicks").innerHTML = `${tr.your_picks}: <strong>${myCount}</strong>`;
    }

    function renderStats(tally) {
      const tr = t();
      const liveDot = $("liveDot");
      liveDot.classList.toggle("on", isConnected);
      $("liveLabel").textContent = isConnected ? tr.live : (hasLoadedSession ? tr.offline : tr.connecting);

      const voters = Object.values(sessionData.ballots || {}).filter(b => b && Object.values(b).some(v => v === true)).length;
      const votes = Object.values(tally).reduce((a, b) => a + b, 0);
      const show = hasLoadedSession;
      $("statsSep").hidden = !show;
      $("statsText").textContent = show
        ? `${plural(voters, tr.voter_singular, tr.voter_plural)} · ${plural(votes, tr.pick_singular, tr.pick_plural)}`
        : "";
    }

    function setButton(btn, icon, label) {
      btn.querySelector(".btn-icon").textContent = icon;
      btn.querySelector(".btn-label").textContent = label;
      btn.title = label;
      btn.setAttribute("aria-label", label);
    }

    function applyStaticTexts() {
      const tr = t();
      const winnerPhase = isWinnerPhase();
      document.documentElement.lang = currentLang;
      langToggleBtn.textContent = tr.lang_toggle;
      langToggleBtn.setAttribute("aria-label", tr.lang_toggle_label);
      $("closeTrailerBtn").textContent = tr.close_trailer;
      $("leaderboardTitle").textContent = tr.lb_nominations;
      $("winnerText").textContent = tr.tonights_movie;
      $("winnerTrailerBtn").textContent = tr.watch_trailer;
      $("vaultSubtitle").textContent = winnerPhase ? tr.subtitle_win : tr.subtitle_nom;
      backBtn.querySelector(".btn-label").textContent = tr.btn_back_sagas;
      searchInput.placeholder = tr.search_placeholder;
      setButton(adminDecideBtn, winnerPhase ? "↩" : "🎯", winnerPhase ? tr.btn_back_nom : tr.btn_decide);
      setButton(adminResetBtn, "⚡", tr.btn_reset);
    }

    function applyLanguage() {
      applyStaticTexts();
      renderView(false);
      if (isWinnerPhase()) renderWinnerScreen();
    }

    window.setVaultLanguage = function (lang) {
      currentLang = lang === "es" ? "es" : "en";
      applyLanguage();
    };

    // ---------- Navigation ----------
    function openSaga(sagaName) {
      if (currentView === "sagas" && !searchQuery) sagasScrollY = window.scrollY;
      activeSaga = sagaName;
      currentView = "movies";
      clearSearch(false);
      renderView(true);
      const top = $("mainHeader").offsetHeight;
      if (window.scrollY > top) window.scrollTo({ top, behavior: "auto" });
    }

    function goToCollections() {
      currentView = "sagas";
      activeSaga = null;
      renderView(true);
      window.scrollTo({ top: sagasScrollY, behavior: "auto" });
    }

    function clearSearch(rerender = true) {
      if (!searchQuery && !searchInput.value) return;
      searchQuery = "";
      searchInput.value = "";
      if (rerender) renderView(true);
    }

    function focusMovie(movieId) {
      const movie = movieById[movieId];
      if (!movie) return;
      openSaga(movie.saga);
      requestAnimationFrame(() => {
        const card = catalogEl.querySelector(`.card[data-id="${movieId}"]`);
        if (!card) return;
        card.scrollIntoView({ block: "center", behavior: "smooth" });
        card.classList.remove("flash");
        void card.offsetWidth;
        card.classList.add("flash");
      });
    }

    backBtn.addEventListener("click", () => {
      if (searchQuery) clearSearch(true);
      else goToCollections();
    });

    searchInput.addEventListener("input", () => {
      const wasSearching = !!searchQuery;
      searchQuery = searchInput.value.trim();
      renderView(!wasSearching && !!searchQuery);
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        clearSearch(true);
        searchInput.blur();
      }
    });

    leaderMoreBtn.addEventListener("click", () => {
      leaderboardExpanded = !leaderboardExpanded;
      updateVoteUI();
    });

    // ---------- Trailer modal ----------
    let trailerRequest = 0;
    let trailerReturnFocus = null;

    async function openTrailer(movieId) {
      const movie = movieById[movieId];
      if (!movie) return;
      const request = ++trailerRequest;
      trailerReturnFocus = document.activeElement;

      $("trailerTitle").textContent = `${movie.title} (${movie.year})`;
      trailerIframe.src = "about:blank";
      trailerModal.hidden = false;
      document.body.classList.add("modal-open");
      $("closeTrailerBtn").focus();

      const key = await fetchTrailerKey(movie);
      if (request !== trailerRequest || trailerModal.hidden) return;
      if (key) {
        trailerIframe.src = `https://www.youtube-nocookie.com/embed/${key}?autoplay=1&vq=hd1080&rel=0&modestbranding=1`;
      } else {
        closeTrailer();
        showToast(t().trailer_unavailable);
      }
    }

    function closeTrailer() {
      if (trailerModal.hidden) return;
      trailerRequest++;
      trailerModal.hidden = true;
      trailerIframe.src = "about:blank";
      if (!$("introModal")) document.body.classList.remove("modal-open");
      if (trailerReturnFocus && document.contains(trailerReturnFocus)) trailerReturnFocus.focus();
    }

    $("closeTrailerBtn").addEventListener("click", closeTrailer);
    trailerModal.addEventListener("click", (e) => { if (e.target === trailerModal) closeTrailer(); });

    // ---------- Global interactions ----------
    document.addEventListener("click", (e) => {
      const el = e.target.closest("[data-action]");
      if (!el) return;
      const { action, id, saga } = el.dataset;
      if (action === "open-saga") openSaga(saga);
      else if (action === "trailer") openTrailer(id);
      else if (action === "vote") handleVoteClick(id, el);
      else if (action === "focus") focusMovie(id);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !trailerModal.hidden) {
        closeTrailer();
        return;
      }
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
      if (e.key === "/" && !typing && !$("introModal") && trailerModal.hidden && !isWinnerPhase()) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    langToggleBtn.addEventListener("click", () => {
      currentLang = currentLang === "en" ? "es" : "en";
      store.set("vault_lang", currentLang);
      applyLanguage();
    });

    // ---------- Winner screen ----------
    function isWinnerPhase() {
      return sessionData.phase === "winner_declared" && !!sessionData.winner;
    }

    async function renderWinnerScreen() {
      const { id, votes, wasTie } = sessionData.winner || {};
      const movie = movieById[id];
      if (!movie) return;
      const tr = t();
      $("winnerTitle").textContent = movie.title;
      $("winnerMeta").textContent = `${movie.year} • ${movie.audio} • [${movie.tag}]`;
      $("winnerVotes").textContent = `${tr.won_with} ${plural(votes, tr.pick_singular, tr.pick_plural)}! ${wasTie ? tr.tie_breaker : ""}`.trim();
      $("winnerTrailerBtn").dataset.id = movie.id;

      const img = $("winnerPoster");
      img.alt = movie.title;
      if (img.dataset.movie !== movie.id) {
        img.dataset.movie = movie.id;
        img.src = PLACEHOLDER;
        winnerSection.style.removeProperty("--winner-bg");
      }
      const url = await getPoster(movie);
      if (url && img.dataset.movie === movie.id) {
        img.src = url;
        winnerSection.style.setProperty("--winner-bg", `url("${url}")`);
      }
    }

    // ---------- Firebase sync ----------
    function onSessionData() {
      const wasWinner = document.body.classList.contains("is-winner");
      const winnerPhase = isWinnerPhase();
      document.body.classList.toggle("is-winner", winnerPhase);
      applyStaticTexts();

      if (winnerPhase) {
        if (!wasWinner) {
          closeTrailer();
          window.scrollTo({ top: 0, behavior: "auto" });
        }
        renderWinnerScreen();
      }
      updateVoteUI();
    }

    onValue(ref(db, ".info/connected"), (snap) => {
      isConnected = snap.val() === true;
      renderStats(computeTally());
    });

    const sessionPointerRef = ref(db, "active_session");
    onValue(sessionPointerRef, (snapshot) => {
      const sessionVal = snapshot.val();
      if (!sessionVal) { set(sessionPointerRef, "round_init"); return; }
      if (sessionVal === currentSession) return;

      // Detach the old round's listener so a stale round can't overwrite the new one.
      if (unsubscribeSession) unsubscribeSession();
      currentSession = sessionVal;

      unsubscribeSession = onValue(ref(db, `sessions/${currentSession}`), (snap) => {
        const val = snap.val() || {};
        sessionData = { phase: val.phase || "nominations", winner: val.winner || null, ballots: val.ballots || {} };
        hasLoadedSession = true;
        onSessionData();
      });
    });

    function handleVoteClick(movieId, button) {
      if (isWinnerPhase()) return;
      if (!currentSession) { showToast(t().still_connecting); return; }
      const isPicked = myBallot()[movieId] === true;
      if (button) {
        button.classList.remove("pop");
        void button.offsetWidth;
        button.classList.add("pop");
      }
      set(ref(db, `sessions/${currentSession}/ballots/${userId}/${movieId}`), isPicked ? null : true)
        .catch(() => showToast(t().write_failed));
    }

    function askForPin() {
      const pin = prompt(t().admin_pin);
      if (pin === null) return false;
      if (pin !== ADMIN_PIN) { showToast(t().wrong_pin); return false; }
      return true;
    }

    adminDecideBtn.addEventListener("click", () => {
      if (!currentSession) { showToast(t().still_connecting); return; }
      if (!askForPin()) return;
      const sessionRef = ref(db, `sessions/${currentSession}`);

      if (!isWinnerPhase()) {
        const tally = computeTally();
        const nominated = Object.keys(tally).filter(id => movieById[id]);
        if (nominated.length === 0) { showToast(t().no_votes); return; }

        const maxVotes = Math.max(...nominated.map(id => tally[id]));
        const tops = nominated.filter(id => tally[id] === maxVotes);
        const winnerId = tops[Math.floor(Math.random() * tops.length)];

        // Single atomic write so other devices never see a winner without the phase change.
        update(sessionRef, { winner: { id: winnerId, votes: maxVotes, wasTie: tops.length > 1 }, phase: "winner_declared" })
          .catch(() => showToast(t().write_failed));
      } else {
        update(sessionRef, { phase: "nominations", winner: null })
          .catch(() => showToast(t().write_failed));
      }
    });

    adminResetBtn.addEventListener("click", () => {
      if (!askForPin()) return;
      set(sessionPointerRef, `round_${Date.now()}`)
        .then(() => showToast(t().reset_done))
        .catch(() => showToast(t().write_failed));
    });

    // First paint right away — votes fill in as soon as Firebase answers.
    applyLanguage();
  </script>
</body>

</html>
