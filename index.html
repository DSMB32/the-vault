<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vault | Movie Night Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0d12;
      --card-bg: #161822;
      --card-border: #232738;
      --accent-har: #eab308;
      --accent-scope: #3b82f6;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --primary: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }
    header {
      padding: 2.5rem 1rem 1.5rem;
      text-align: center;
      background: linear-gradient(180deg, #181b29 0%, transparent 100%);
    }
    h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
    h1 span { color: var(--accent-har); }
    .subtitle { color: var(--text-dim); font-size: 0.95rem; }

    .sticky-top {
      position: sticky;
      top: 0;
      background: rgba(12, 13, 18, 0.92);
      backdrop-filter: blur(12px);
      z-index: 50;
      padding: 1rem;
      border-bottom: 1px solid var(--card-border);
    }
    .controls {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .search-bar input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #11131a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .pill {
      background: #1f2333;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }
    .pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .leaderboard-section {
      max-width: 900px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
    }
    .leaderboard-box {
      background: #12141f;
      border: 1px solid #2d334a;
      border-radius: 12px;
      padding: 1rem;
    }
    .leaderboard-box h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-har);
      margin-bottom: 0.75rem;
    }
    .leader-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .leader-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 0.4rem 0.6rem;
      background: #1a1d2d;
      border-radius: 6px;
    }
    .leader-votes { font-weight: 700; color: #10b981; }

    .catalog {
      max-width: 900px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease;
    }
    .card:hover { transform: translateY(-2px); }
    .card-top { margin-bottom: 0.8rem; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    .badge-har { background: rgba(234, 179, 8, 0.15); color: var(--accent-har); border: 1px solid rgba(234, 179, 8, 0.3); }
    .badge-scope { background: rgba(59, 130, 246, 0.15); color: var(--accent-scope); border: 1px solid rgba(59, 130, 246, 0.3); }
    .card-title { font-size: 1rem; font-weight: 600; line-height: 1.35; margin-bottom: 0.3rem; }
    .card-meta { font-size: 0.75rem; color: var(--text-dim); }

    .card-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
      padding-top: 0.6rem;
      border-top: 1px solid #1f2438;
    }
    .vote-count { font-size: 0.85rem; font-weight: 600; color: var(--text-dim); }
    .vote-btn {
      background: #252b42;
      border: 1px solid #373e5c;
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .vote-btn:hover { background: var(--primary); border-color: var(--primary); }
    .vote-btn.voted { background: #10b981; border-color: #10b981; }
  </style>
</head>
<body>

<header>
  <h1>THE <span>VAULT</span></h1>
  <p class="subtitle">100-Inch Home Theater Experience • Pick what we watch</p>
</header>

<div class="sticky-top">
  <div class="controls">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by title, year, audio track...">
    </div>
    <div class="filters">
      <button class="pill active" data-filter="all">All (89)</button>
      <button class="pill" data-filter="HAR">[HAR] High Aspect Ratio (58)</button>
      <button class="pill" data-filter="Scope">[Scope] 2.39:1 (13)</button>
    </div>
  </div>
</div>

<div class="leaderboard-section">
  <div class="leaderboard-box">
    <h3>🔥 Top Voted Right Now</h3>
    <div class="leader-list" id="leaderList">
      <div style="font-size:0.85rem; color: var(--text-dim);">No votes recorded yet. Be the first!</div>
    </div>
  </div>
</div>

<main class="catalog" id="catalog"></main>

    { id: "scope_9", title: "Spider-Man: Homecoming", year: 2017, tag: "Scope", audio: "5.1 Surround" },
    { id: "scope_10", title: "Star Wars: The Force Awakens", year: 2015, tag: "Scope", audio: "5.1 Surround" },
    { id: "scope_11", title: "The Hunger Games", year: 2012, tag: "Scope", audio: "7.1 Surround" },
    { id: "scope_12", title: "The Hunger Games: Ballad of Songbirds and Snakes", year: 2023, tag: "Scope", audio: "7.1 Surround" },
    { id: "scope_13", title: "The Hunger Games: Mockingjay Part 1", year: 2014, tag: "Scope", audio: "7.1 Surround" },
    { id: "scope_14", title: "The Hunger Games: Mockingjay Part 2", year: 2015, tag: "Scope", audio: "7.1 Surround" },
    { id: "scope_15", title: "Thunderbolts*", year: 2025, tag: "Scope", audio: "7.1 Surround" }
  ];

  let currentFilter = "all";
  let searchQuery = "";
  let liveVotes = {};
  let myVotes = JSON.parse(localStorage.getItem("vault_my_votes") || "[]");

  const catalogEl = document.getElementById("catalog");
  const searchInput = document.getElementById("searchInput");
  const pills = document.querySelectorAll(".pill");
  const leaderList = document.getElementById("leaderList");

  const votesRef = ref(db, "movie_votes");
  onValue(votesRef, (snapshot) => {
    liveVotes = snapshot.val() || {};
    renderCatalog();
    renderLeaderboard();
  });

  function renderCatalog() {
    catalogEl.innerHTML = "";
    const filtered = movies.filter(m => {
      const matchFilter = currentFilter === "all" || m.tag === currentFilter;
      const matchSearch = m.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                          m.year.toString().includes(searchQuery) ||
                          m.audio.toLowerCase().includes(searchQuery.toLowerCase());
      return matchFilter && matchSearch;
    });

    filtered.forEach(m => {
      const isVoted = myVotes.includes(m.id);
      const voteCount = liveVotes[m.id] || 0;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-top">
          <span class="badge ${m.tag === 'HAR' ? 'badge-har' : 'badge-scope'}">${m.tag}</span>
          <div class="card-title">${m.title}</div>
          <div class="card-meta">${m.year} • ${m.audio}</div>
        </div>
        <div class="card-action">
          <span class="vote-count">${voteCount} ${voteCount === 1 ? 'vote' : 'votes'}</span>
          <button class="vote-btn ${isVoted ? 'voted' : ''}" data-id="${m.id}">
            ${isVoted ? '✓ Picked' : '+ Pick'}
          </button>
        </div>
      `;
      card.querySelector(".vote-btn").addEventListener("click", () => toggleVote(m.id));
      catalogEl.appendChild(card);
    });
  }

  function renderLeaderboard() {
    const sorted = Object.entries(liveVotes)
      .map(([id, count]) => ({ movie: movies.find(m => m.id === id), count }))
      .filter(item => item.movie && item.count > 0)
      .sort((a, b) => b.count - a.count)
      .slice(0, 5);

    if (sorted.length === 0) {
      leaderList.innerHTML = `<div style="font-size:0.85rem; color: var(--text-dim);">No votes recorded yet. Be the first!</div>`;
      return;
    }

    leaderList.innerHTML = sorted.map(item => `
      <div class="leader-item">
        <span><strong>${item.movie.title}</strong> (${item.movie.tag})</span>
        <span class="leader-votes">${item.count} votes</span>
      </div>
    `).join("");
  }

  window.toggleVote = function(movieId) {
    const hasVoted = myVotes.includes(movieId);
    if (!hasVoted && myVotes.length >= 3) {
      alert("You have reached the maximum of 3 picks per movie night!");
      return;
    }

    const targetRef = ref(db, `movie_votes/${movieId}`);
    runTransaction(targetRef, (current) => {
      if (hasVoted) {
        return (current || 1) - 1;
      } else {
        return (current || 0) + 1;
      }
    });

    if (hasVoted) {
      myVotes = myVotes.filter(id => id !== movieId);
    } else {
      myVotes.push(movieId);
    }
    localStorage.setItem("vault_my_votes", JSON.stringify(myVotes));
    renderCatalog();
  };

  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderCatalog();
  });

  pills.forEach(pill => {
    pill.addEventListener("click", () => {
      pills.forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      currentFilter = pill.dataset.filter;
      renderCatalog();
    });
  });

  renderCatalog();
</script>
</body>
